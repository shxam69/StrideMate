<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="frogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="frogSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#frogBg)"/>
  <!-- Top Eyes Bumps -->
  <circle cx="36" cy="42" r="16" fill="url(#frogSkin)"/>
  <circle cx="84" cy="42" r="16" fill="url(#frogSkin)"/>
  <!-- Eyes -->
  <circle cx="36" cy="40" r="10" fill="#FEF08A"/>
  <ellipse cx="36" cy="40" rx="4" ry="7" fill="#0F172A"/>
  <circle cx="37" cy="37" r="1.5" fill="#FFFFFF"/>
  <circle cx="84" cy="40" r="10" fill="#FEF08A"/>
  <ellipse cx="84" cy="40" rx="4" ry="7" fill="#0F172A"/>
  <circle cx="85" cy="37" r="1.5" fill="#FFFFFF"/>
  <!-- Head / Body -->
  <ellipse cx="60" cy="72" rx="42" ry="32" fill="url(#frogSkin)"/>
  <!-- Pink Cheeks -->
  <ellipse cx="28" cy="74" rx="7" ry="5" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="92" cy="74" rx="7" ry="5" fill="#F472B6" opacity="0.6"/>
  <!-- Nostrils -->
  <circle cx="55" cy="66" r="1.5" fill="#15803D"/>
  <circle cx="65" cy="66" r="1.5" fill="#15803D"/>
  <!-- Wide Smile -->
  <path d="M 34 76 Q 60 98 86 76" stroke="#052E16" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
