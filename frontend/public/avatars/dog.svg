  <path d="M 54 78 Q 60 84 66 78" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 57 80 C 57 88, 63 88, 63 80 Z" fill="#F43F5E"/>
