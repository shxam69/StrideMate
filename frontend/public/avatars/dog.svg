  </defs>
  <rect width="120" height="120" rx="28" fill="url(#dogBg)"/>
  <!-- Droopy Ears -->
  <ellipse cx="26" cy="56" rx="14" ry="24" fill="url(#dogEars)" transform="rotate(15 26 56)"/>
  <ellipse cx="94" cy="56" rx="14" ry="24" fill="url(#dogEars)" transform="rotate(-15 94 56)"/>
  <!-- Face -->
  <circle cx="60" cy="65" r="36" fill="url(#dogFur)"/>
  <!-- Snout Area -->
  <ellipse cx="60" cy="76" rx="18" ry="14" fill="#FEF3C7"/>
  <!-- Eyes -->
  <ellipse cx="44" cy="56" rx="4.5" ry="6" fill="#1E293B"/>
  <circle cx="45" cy="54" r="2" fill="#FFFFFF"/>
  <ellipse cx="76" cy="56" rx="4.5" ry="6" fill="#1E293B"/>
  <circle cx="75" cy="54" r="2" fill="#FFFFFF"/>
  <!-- Nose -->
  <ellipse cx="60" cy="72" rx="7" ry="5.5" fill="#1E293B"/>
