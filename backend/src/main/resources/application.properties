spring.application.name=StrideMate API

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:stridemate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (For development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Note: In production, these should be set via environment variables.
jwt.secret=${JWT_SECRET:default_local_development_secret_key_change_me_in_production_environment_12345}
jwt.expiration=900000

# Logging
logging.level.org.springframework.security=DEBUG
